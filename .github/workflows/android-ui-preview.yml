name: Android UI preview

on:
  push:
    branches: [feat/menu-pack-experience]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build signed UI preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2-stable
      BUILD_CACHE: /tmp/paint-with-gems-build
      ANDROID_SDK_SOURCE: existing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install matching Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          editor="$BUILD_CACHE/godot-$GODOT_VERSION"
          templates="$BUILD_CACHE/xdg/data/godot/export_templates/4.7.2.stable"
          release="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          mkdir -p "$editor" "$templates"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            "$release/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$editor"
          chmod +x "$editor/Godot_v${GODOT_VERSION}_linux.x86_64"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 \
            "$release/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' -d "$templates"
          rm "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/godot.zip"
      - name: Build an independently installable preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('export_presets.cfg')
          text = path.read_text()
          text = text.replace('package/unique_name="com.squishter.paintwithgems"',
                              'package/unique_name="com.squishter.paintwithgems.uipreview"')
          text = text.replace('package/name="Paint With Gems"', 'package/name="Paint With Gems UI Preview"')
          path.write_text(text)
          PY
          bash tools/build_apk.sh debug
          mv build/paint-with-gems-debug.apk build/paint-with-gems-ui-preview.apk
      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose build/paint-with-gems-ui-preview.apk
          sha256sum build/paint-with-gems-ui-preview.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paint-with-gems-ui-preview
          path: |
            build/paint-with-gems-ui-preview.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
