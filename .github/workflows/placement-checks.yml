name: Placement animation checks

on:
  push:
    branches: [feat/gem-placement-polish]
  pull_request:
    paths:
      - scenes/game/gem_flights.gd
      - scenes/game/gem_placement_fx.gd
      - scenes/game/play_screen.gd
      - render/placement_beam.gdshader
      - tests/run_placements.gd
      - tests/prepare_placement_baseline.py
      - .github/workflows/placement-checks.yml

permissions:
  contents: read

jobs:
  placements:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native rendering tools and Godot 4.7.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Compile and run regressions with real Vulkan shader compilation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: /tmp/gem-placement-ci-data
          XDG_CONFIG_HOME: /tmp/gem-placement-ci-config
          XDG_CACHE_HOME: /tmp/gem-placement-ci-cache
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          python3 tests/prepare_placement_baseline.py
          "$godot" --headless --editor --import --quit --path .
          "$godot" --headless --path . -s res://tools/check_scripts.gd
          "$godot" --headless --path . -s res://tests/run_menu_ui.gd
          "$godot" --headless --path . -s res://tests/run_pack_bundles.gd
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*' | head -n 1)"
          xvfb-run -a -s '-screen 0 1080x2400x24' "$godot" \
            --path . --resolution 1080x2400 --audio-driver Dummy \
            --rendering-method mobile --rendering-driver vulkan \
            -s res://tests/run_placements.gd 2>&1 | tee "$RUNNER_TEMP/placement-checks.log"
          if rg -q 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/placement-checks.log"; then exit 1; fi
